# Calls the shared Lunova workflow. Generated by the lunova-deploy skill; edit only the branch.
name: Lunova deploy

on:
  push:
    branches: [production]
  pull_request:            # a PR into the deploy branch runs a safe preflight (mode=check), never a deploy
    branches: [production]
  workflow_dispatch:
    inputs:
      mode:
        description: "deploy | check | rollback | status | logs"
        type: choice
        options: [deploy, check, rollback, status, logs]
        default: deploy
      rollback_to:
        description: "Release id (empty = previous healthy release)"
        type: string
        default: ""
      lines:
        description: "Log lines (logs mode)"
        type: string
        default: "80"

# id-token: write lets the run prove its identity to the Lunova server (GitHub OIDC). There are no keys or secrets to set up.
permissions:
  contents: read
  id-token: write

jobs:
  lunova:
    uses: lunova-digital/lunova-deploy/.github/workflows/deploy.yml@v2
    with:
      mode: ${{ github.event_name == 'pull_request' && 'check' || inputs.mode || 'deploy' }}
      rollback_to: ${{ inputs.rollback_to || '' }}
      lines: ${{ inputs.lines || '80' }}
