# .lunova.yml: tells the Lunova server how to run this project.
# Generated by the lunova-deploy skill. Full reference: lunova-deploy skill, references/manifest.md
site: pulse
type: laravel
domains:
  - pulse.lunovadigital.net
php: "8.3"
node: "22"
database: sqlite
build:
  - composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
  - npm ci
  - npm run build
hooks:
  - php artisan migrate --force
  - php artisan db:seed --class=UserSeeder --force
  - php artisan config:cache
  - php artisan route:cache
  - php artisan view:cache
  - php artisan event:cache
  - php artisan storage:link
health_path: /login
scheduler: true
queue: true
